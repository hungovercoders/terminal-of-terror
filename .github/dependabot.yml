# Keeps the dependencies moving as pull requests, so an advisory arrives
# with its fix instead of as an alert nobody owns.
version: 2
updates:
  # Go modules: the program itself. AGENTS.md asks for a small dependency
  # list, so each bump is its own PR, judged on its merits.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # The root package.json is CI tooling only: slopstopper's browser checks
  # (Playwright, axe, Lighthouse CI) and wrangler for the Cloudflare deploy.
  # Minor and patch bumps come as one PR a week; a major gets its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"

  # ci.yml and release.yml pin actions by major tag; this keeps them current.
  # The ss-*.yml workflows are copied in by slopstopper's installer, pins
  # included, so a bump there is merged upstream and arrives on refresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
