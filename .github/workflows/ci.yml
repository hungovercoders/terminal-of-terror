name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, vet and tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "Run 'go mod tidy' and commit the result." && exit 1)

      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Keep progress and community packs out of the runner's real config dir.
      TERMINAL_OF_TERROR_HOME: ${{ github.workspace }}/.tot-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests (with race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Unit tests
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Build
        run: go build -o terminal-of-terror${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Smoke test the commands
        shell: bash
        run: |
          set -euo pipefail
          bin=./terminal-of-terror
          [ "$RUNNER_OS" = "Windows" ] && bin=./terminal-of-terror.exe
          $bin --help > /dev/null
          $bin --version
          $bin completion bash > /dev/null
          $bin __complete monster drac | grep -q '^dracula'
          $bin __complete quiz --pack folk | grep -q '^folklore'
          go run ./scripts/shelldocs -out "$RUNNER_TEMP/shelldocs"
          test -s "$RUNNER_TEMP/shelldocs/man/terminal-of-terror.1"
          $bin list > /dev/null
          $bin list --json > /dev/null
          $bin random > /dev/null
          $bin random --daily --date 2026-10-31 > /dev/null
          $bin monster dracula --json > /dev/null
          $bin quiz -n 3 --json > /dev/null
          $bin countdown --date 2026-10-13 > /dev/null
          $bin tonight --date 2026-10-31 > /dev/null
          $bin mash dracula mummy --fast > /dev/null
          $bin mash dracula mummy --json > /dev/null
          $bin guess -n 2 --json > /dev/null
          $bin tonight --date 2026-10-31 --json > /dev/null
          $bin countdown --date 2026-10-13 --json > /dev/null
          $bin crypt > /dev/null
          $bin crypt --json > /dev/null
          # Off a terminal the output is plain: no colour codes, no emoji; NO_COLOR and --no-color ask for the same.
          if $bin list | grep -q $'\x1b'; then
            echo "expected no colour codes in a pipe"
            exit 1
          fi
          if $bin list | grep -q '🎃'; then
            echo "expected no emoji in a pipe"
            exit 1
          fi
          $bin random --date 2026-10-31 --no-color > /dev/null
          NO_COLOR=1 $bin countdown --date 2026-10-13 > /dev/null
          # Under --json an error is one object on stderr with a stable code.
          # (Captured first: with pipefail, the binary's exit 1 would fail the pipeline before grep could pass.)
          err=$($bin monster zombie-accountant --json 2>&1 || true)
          if [[ "$err" != *'"code":"unknown-monster"'* ]]; then
            echo "expected a JSON error with code unknown-monster, got: $err"
            exit 1
          fi
          $bin packs new ci-pack > /dev/null
          # A community pack can't take a built-in pack's id.
          if $bin packs new cryptids 2> /dev/null; then
            echo "expected an error for a built-in pack id"
            exit 1
          fi
          $bin list --pack ci-pack > /dev/null
          $bin packs > /dev/null
          # Unknown names should fail cleanly rather than crash.
          if $bin monster zombie-accountant 2> /dev/null; then
            echo "expected an error for an unknown monster"
            exit 1
          fi
          # The screens refuse a pipe instead of hanging or spraying escape codes.
          if $bin monster < /dev/null > /dev/null 2>&1; then
            echo "expected the explorer to refuse to run without a terminal"
            exit 1
          fi
          if $bin crypt reset < /dev/null > /dev/null 2>&1; then
            echo "expected crypt reset to refuse without a terminal or -y"
            exit 1
          fi
