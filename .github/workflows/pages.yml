# Builds the website with `go run ./site` and publishes it to GitHub Pages
# on every push to main. Enable it once in the repository settings:
# Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main, fix/pages-enablement]
    paths:
      - "site/**"
      - "docs/**"
      - "internal/monsters/**"
      - "internal/crypt/**"
      - "internal/host/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site (source: GitHub Actions) if the
          # repository doesn't have one yet.
          enablement: true
      - name: Generate
        run: go run ./site -out site/dist -base "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
