# .github/labeler.yml: seeded by slopstopper install.sh.
#
# Drives the ss-hygiene-auto-label-pr workflow. Maps changed-file globs
# to PR labels. These are sensible starting categories, so adjust them to
# your repo's structure.
#
# Format: actions/labeler@v5
#   <label-name>:
#     - changed-files:
#         - any-glob-to-any-file: ['<glob1>', '<glob2>']

docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md', 'course/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'Taskfile*.yml', '.ss/**', 'mise.toml', '.goreleaser.yaml', '.githooks/**']

deps:
  - changed-files:
      - any-glob-to-any-file: ['go.mod', 'go.sum', 'package.json', 'package-lock.json']

src:
  - changed-files:
      # One file must be Go source or the site, and not a test.
      - all-globs-to-any-file: ['{main.go,cmd/**/*.go,internal/**/*.go,site/**}', '!**/*_test.go']

monsters:
  - changed-files:
      - any-glob-to-any-file: ['internal/monsters/packs/**']

tests:
  - changed-files:
      - any-glob-to-any-file: ['**/*_test.go', '.ss/tests/**']

security:
  - changed-files:
      - any-glob-to-any-file: ['.zap/**', '.gitleaks.toml', 'public/_headers']

config:
  - changed-files:
      - any-glob-to-any-file: ['.slopstopper.yml', 'wrangler.jsonc']
